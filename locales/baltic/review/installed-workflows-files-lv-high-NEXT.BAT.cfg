@ECHO OFF
CTTY AUX
C:
CD \
PATH C:\DOS
C:\DOS\NLSFUNC.EXE
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\MODE.COM CON CP PREPARE=((775) C:\DOS\EGA775.CPI)
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\MODE.COM CON CP SELECT=775
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\KEYB.COM LV,775,C:\DOS\KEYBRD2.SYS /ID:0
IF ERRORLEVEL 1 GOTO FAIL
C:\PROFILE.COM
IF ERRORLEVEL 1 GOTO FAIL
CD ËDIR
IF ERRORLEVEL 1 GOTO FAIL
TYPE ËFILE.TXT > C:\REBOOT.TXT
IF ERRORLEVEL 1 GOTO FAIL
TYPE ËSUB\ËDOC.Ë > C:\REBNEST.TXT
IF ERRORLEVEL 1 GOTO FAIL
DIR /B /O:N *.TXT > C:\REORDER.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL ËSUB\ËDOC.Ë
IF ERRORLEVEL 1 GOTO FAIL
DEL ËSUB\EXT.*
IF ERRORLEVEL 1 GOTO FAIL
RD ËSUB
IF ERRORLEVEL 1 GOTO FAIL
DEL *.TXT
IF ERRORLEVEL 1 GOTO FAIL
CD \
IF ERRORLEVEL 1 GOTO FAIL
RD ËDIR
IF ERRORLEVEL 1 GOTO FAIL
TYPE ËMOVED\ËSUB\ËDOC.Ë > C:\TREE1.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL ËMOVED\ËSUB\ËDOC.Ë
IF ERRORLEVEL 1 GOTO FAIL
RD ËMOVED\ËSUB
IF ERRORLEVEL 1 GOTO FAIL
RD ËMOVED\ËEMPTY
IF ERRORLEVEL 1 GOTO FAIL
RD ËMOVED
IF ERRORLEVEL 1 GOTO FAIL
TYPE ËCLONE\ËSUB\ËDOC.Ë > C:\TREE2.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL ËCLONE\ËSUB\ËDOC.Ë
IF ERRORLEVEL 1 GOTO FAIL
RD ËCLONE\ËSUB
IF ERRORLEVEL 1 GOTO FAIL
RD ËCLONE\ËEMPTY
IF ERRORLEVEL 1 GOTO FAIL
RD ËCLONE
IF ERRORLEVEL 1 GOTO FAIL
ECHO RU_FILES_REBOOTED
QEXIT.COM
:FAIL
ECHO RU_FILES_FAIL
QEXIT.COM

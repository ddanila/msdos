@ECHO OFF
CTTY AUX
C:
CD \
PATH C:\DOS
C:\DOS\NLSFUNC.EXE
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\MODE.COM CON CP PREPARE=((775) C:\DOS\EGA775.CPI)
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\MODE.COM CON CP SELECT=775
IF ERRORLEVEL 1 GOTO FAIL
C:\DOS\KEYB.COM LT,775,C:\DOS\KEYBRD2.SYS /ID:221
IF ERRORLEVEL 1 GOTO FAIL
C:\PROFILE.COM
IF ERRORLEVEL 1 GOTO FAIL
CD µDIR
IF ERRORLEVEL 1 GOTO FAIL
TYPE µFILE.TXT > C:\REBOOT.TXT
IF ERRORLEVEL 1 GOTO FAIL
TYPE µSUB\µDOC.µ > C:\REBNEST.TXT
IF ERRORLEVEL 1 GOTO FAIL
DIR /B /O:N *.TXT > C:\REORDER.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL µSUB\µDOC.µ
IF ERRORLEVEL 1 GOTO FAIL
DEL µSUB\EXT.*
IF ERRORLEVEL 1 GOTO FAIL
RD µSUB
IF ERRORLEVEL 1 GOTO FAIL
DEL *.TXT
IF ERRORLEVEL 1 GOTO FAIL
CD \
IF ERRORLEVEL 1 GOTO FAIL
RD µDIR
IF ERRORLEVEL 1 GOTO FAIL
TYPE µMOVED\µSUB\µDOC.µ > C:\TREE1.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL µMOVED\µSUB\µDOC.µ
IF ERRORLEVEL 1 GOTO FAIL
RD µMOVED\µSUB
IF ERRORLEVEL 1 GOTO FAIL
RD µMOVED\µEMPTY
IF ERRORLEVEL 1 GOTO FAIL
RD µMOVED
IF ERRORLEVEL 1 GOTO FAIL
TYPE µCLONE\µSUB\µDOC.µ > C:\TREE2.TXT
IF ERRORLEVEL 1 GOTO FAIL
DEL µCLONE\µSUB\µDOC.µ
IF ERRORLEVEL 1 GOTO FAIL
RD µCLONE\µSUB
IF ERRORLEVEL 1 GOTO FAIL
RD µCLONE\µEMPTY
IF ERRORLEVEL 1 GOTO FAIL
RD µCLONE
IF ERRORLEVEL 1 GOTO FAIL
ECHO RU_FILES_REBOOTED
QEXIT.COM
:FAIL
ECHO RU_FILES_FAIL
QEXIT.COM
